name: RoK reminders

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (UTC)
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write

concurrency: reminders

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python remind.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Save sent list
        run: |
          git config user.name "reminder-bot"
          git config user.email "reminder-bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || (git commit -m "reminders sent" && git push)
